name: CI

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: '17 3 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-test-sast:
    name: Build, tests, SAST (SpotBugs + FindSecBugs)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      security-events: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Set up JDK 21
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Generate per-run secrets
        run: |
          for name in POSTGRES_ADMIN_PASSWORD DB_OWNER_PASSWORD DB_APP_PASSWORD; do
            value="$(openssl rand -hex 24)"
            echo "::add-mask::${value}"
            echo "${name}=${value}" >> "${GITHUB_ENV}"
          done
          jwt="$(openssl rand -base64 32)"
          echo "::add-mask::${jwt}"
          {
            echo "JWT_SECRET=${jwt}"
            echo "DB_OWNER_USERNAME=lab1_owner"
            echo "DB_APP_USERNAME=lab1_app"
          } >> "${GITHUB_ENV}"

      - name: Start PostgreSQL 18.6
        run: |
          docker run --detach --name postgres --publish 127.0.0.1:5432:5432 \
            -e POSTGRES_PASSWORD="${POSTGRES_ADMIN_PASSWORD}" \
            postgres:18.6@sha256:3a4264520e121176619f54ff867d12774bc81e95e7b84db58d63bccdb6144b81
          for attempt in $(seq 1 30); do
            docker exec postgres pg_isready --username postgres --quiet && exit 0
            sleep 1
          done
          echo "::error::PostgreSQL did not become ready"
          exit 1

      - name: Ensure psql client
        run: |
          command -v psql >/dev/null || { sudo apt-get update -q && sudo apt-get install -y -q postgresql-client; }
          psql --version

      - name: Bootstrap roles and databases (least privilege)
        env:
          PGHOST: 127.0.0.1
          PGUSER: postgres
          PGPASSWORD: ${{ env.POSTGRES_ADMIN_PASSWORD }}
        run: ./scripts/db-bootstrap.sh

      - name: Build, test, SAST
        run: ./mvnw -B -ntp verify

      - name: Upload SAST results to code scanning
        if: always() && hashFiles('target/spotbugsSarif.json') != '' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
        uses: github/codeql-action/upload-sarif@9b3254085494b55a0f7c4c2b3d2d52cc712ce370
        with:
          sarif_file: target/spotbugsSarif.json
          category: spotbugs-findsecbugs

      - name: Upload test and SAST reports
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: sast-and-test-reports
          path: |
            target/spotbugsXml.xml
            target/spotbugsSarif.json
            target/surefire-reports/
          retention-days: 30

  sca:
    name: SCA (OWASP Dependency-Check)
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    permissions:
      contents: read
      security-events: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Set up JDK 21
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Cache key for NVD data (refreshed daily)
        id: nvd-cache-key
        run: echo "day=$(date -u +%Y-%m-%d)" >> "${GITHUB_OUTPUT}"

      - name: Restore NVD database
        id: nvd-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: ~/.cache/dependency-check-data
          key: dependency-check-data-${{ steps.nvd-cache-key.outputs.day }}
          restore-keys: dependency-check-data-

      - name: Update NVD database
        run: ./mvnw -B -ntp dependency-check:update-only -DdataDirectory="${HOME}/.cache/dependency-check-data"

      - name: Save NVD database
        if: steps.nvd-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: ~/.cache/dependency-check-data
          key: dependency-check-data-${{ steps.nvd-cache-key.outputs.day }}

      - name: Dependency-Check (fails on CVSS >= 7)
        run: ./mvnw -B -ntp dependency-check:check -DautoUpdate=false -DdataDirectory="${HOME}/.cache/dependency-check-data"

      - name: Upload SCA results to code scanning
        if: always() && hashFiles('target/dependency-check-report.sarif') != '' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
        uses: github/codeql-action/upload-sarif@9b3254085494b55a0f7c4c2b3d2d52cc712ce370
        with:
          sarif_file: target/dependency-check-report.sarif
          category: owasp-dependency-check

      - name: Upload SCA reports
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: sca-reports
          path: target/dependency-check-report.*
          retention-days: 30
